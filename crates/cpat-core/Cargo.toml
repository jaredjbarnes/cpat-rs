[package]
name = "cpat-core"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.19.2"
regex = "1.13.1"
# Builds the class `(?i)\P{…}` stands for in JS (DESIGN §6). Already
# compiled in, under `regex`.
regex-syntax = "0.8.11"
# A decorator's argument is what v12's `JSON.parse` gives (DESIGN §9):
# `preserve_order` keeps an object's keys as written, `float_roundtrip`
# rounds every decimal to the nearest double, as JS does.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
unicode-segmentation = "1.13.3"

[features]
# Logs every `Literal::parse` call on a thread-local list, so tests can
# assert which literals a choice parsed (`cpat_core::parse_log`). Off in
# real builds: it would cost every literal a push.
parse-log = []

[dev-dependencies]
# The integration tests read the parse log.
cpat-core = { path = ".", features = ["parse-log"] }
